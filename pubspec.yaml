name: gps_map_camera_app

description: Geo Tag Camera App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0


dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_native_splash: ^2.4.0

dependencies:

  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.0


  cupertino_icons: ^1.0.8
  reorderable_grid_view: ^2.2.6

  # CAMERA
  camera: ^0.11.0+2
  video_player: ^2.11.1

  # LOCATION
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0

  # MAP
  flutter_map: ^6.2.1
  latlong2: ^0.9.0
  http: ^1.2.0
  cached_network_image: ^3.3.0

  # IMAGE PROCESSING 
  image: ^4.3.0
  
  # IMAGE PICK
  image_picker: ^1.2.1

  # FILE PICK
  file_picker: ^8.0.0+1

  # PDF EXPORT
  pdf: ^3.11.1
  printing: ^5.12.0
  excel: ^4.0.6
  share_plus: ^12.0.2
  open_file: ^3.5.5

  # STORAGE
  path_provider: ^2.1.5
  path: ^1.9.0

  # OCR
  google_mlkit_text_recognition: ^0.13.0

  # PAGE REORDER
  reorderables: ^0.6.0

  # STATE MGMT
  provider: ^6.0.5

  # DATABASE
  postgres: ^3.0.0

  # PERMISSIONS
  permission_handler: ^11.3.0

  # UI
  flutter_svg: ^2.0.16

  # COMPRESS
  flutter_image_compress: ^2.3.0

  # UTIL
  uuid: ^4.5.1
  intl: 0.20.2
  exif: ^3.3.0
  native_exif: ^0.6.1
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5

  google_mlkit_document_scanner: ^0.4.0

  url_launcher: ^6.3.0


flutter:
  uses-material-design: true

  assets:
    - assets/watermark/default_logo.png
    - assets/logo/logo.png
    - assets/logo/splash_logo.png 


flutter_launcher_icons:
   
  android: true
  ios: true
  image_path: assets/logo/logo.png


flutter_native_splash:
  color: "#ffffff"   # background color
  image: assets/logo/splash_logo.png

  android: true
  ios: true